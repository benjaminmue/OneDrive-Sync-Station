name: CI

# Two jobs: the test suite (fast, runs on every push) and a container build that
# proves the pinned client still compiles and its runtime libraries are complete.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test

  image:
    runs-on: ubuntu-latest
    # The client is compiled from source, so this job is minutes rather than
    # seconds. The cap is there so a hanging verification step cannot burn an
    # entire runner slot for hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # amd64 only: building the D client under QEMU emulation for arm64 takes
      # hours, and Unraid is x86_64 anyway. Cross building for arm is a separate
      # exercise, not a prerequisite for the target platform.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: onedrive-sync-station:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is only useful if the client actually runs and the station
      # answers. Both are checked here rather than after a release.
      # Passing a command runs it instead of the station: the entrypoint honours
      # its arguments, so this exercises the real image, permission setup and
      # all, and still returns.
      - name: Verify the client runs
        timeout-minutes: 2
        run: docker run --rm onedrive-sync-station:ci onedrive --version

      - name: Verify the station starts and serves its API
        timeout-minutes: 3
        run: |
          docker run -d --name station -p 8080:8080 onedrive-sync-station:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health; then
              echo "station is up"
              exit 0
            fi
            sleep 2
          done
          echo "station did not come up in time"
          docker logs station
          exit 1

      - name: Container logs on failure
        if: failure()
        run: docker logs station || true
