name: Build and publish image

# Version tags (vX.Y.Z) publish the release tags and the GitHub release, pushes
# to `beta` publish :beta for pre-release testing.
on:
  push:
    tags:
      - "v*"
    branches:
      - beta
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # The tests gate the publish. Without this the workflow would happily push an
  # image whose suite is red, which is exactly what happened once: the publish
  # was triggered by hand while a broken test sat in the commit.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/beta' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      # amd64 only, see the comment in ci.yml: the D client cannot reasonably be
      # built for arm64 under emulation, and the target platform is Unraid.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            BUILD_REF=${{ github.sha }}
            BUILD_DATE=${{ github.run_started_at }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A version tag alone does not make a GitHub release, so the repository page
  # showed no release at all for v0.7.2. The notes are the version's CHANGELOG
  # section; a tag without one fails here instead of publishing empty notes.
  # gh is preinstalled on the runner, no third-party release action needed.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 { f = 1; next } /^## \[/ { f = 0 } f' CHANGELOG.md \
            | sed -e '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${version}"
            exit 1
          fi
          image="$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          printf '\nImage: `%s:%s`\n' "$image" "$version" >> notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release ${TAG} already exists, leaving it as it is."
            exit 0
          fi
          # A tag with a suffix (v1.2.3-rc1) is a pre-release and never Latest,
          # matching the image tags above.
          case "$TAG" in
            *-*) gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md --prerelease --latest=false ;;
            *) gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md --latest ;;
          esac
