<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Sibling of the Obsidian Sync Station mark: same dark rounded tile, same
       flat treatment, in the OneDrive blues.

       The geometry is shared with tools/make-icon.mjs, which renders the PNG
       used by Community Applications. Change one, change the other. -->
  <rect width="256" height="256" rx="52" fill="#10233a"/>
  <!-- Base: ends inside the lobes, so they draw the silhouette. -->
  <rect x="62" y="133" width="140" height="46" rx="23" fill="#0364b8"/>
  <circle cx="100" cy="130" r="33" fill="#0f78d4"/>
  <circle cx="151" cy="113" r="45" fill="#28a8ea"/>
  <!-- Highlight along the upper left of the big lobe, so the two lobes stay
       distinguishable at sidebar size. -->
  <path d="M110.5 113A40.5 40.5 0 0 1 151 72.5" fill="none" stroke="#5cc0f2"
        stroke-width="9" stroke-linecap="round"/>
</svg>
